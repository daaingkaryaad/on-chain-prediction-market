type Market @entity(immutable: false) {
  id: Bytes!
  marketAddress: Bytes!
  creator: Bytes!
  question: String!
  collateralToken: Bytes!
  outcomeToken: Bytes!
  lpToken: Bytes!
  oracleAdapter: Bytes!
  resolutionTime: BigInt!
  initialLiquidity: BigInt!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  createdAtTx: Bytes!

  yesVolume: BigInt!
  noVolume: BigInt!
  totalVolume: BigInt!
  liquidityAdded: BigInt!
  liquidityRemoved: BigInt!
  rewardsClaimed: BigInt!

  resolved: Boolean!
  winningOutcome: String
  resolvedAt: BigInt
  oracleAnswer: BigInt

  trades: [Trade!]! @derivedFrom(field: "market")
  liquidityEvents: [LiquidityEvent!]! @derivedFrom(field: "market")
  claims: [RewardClaim!]! @derivedFrom(field: "market")
}

type Trade @entity(immutable: true) {
  id: Bytes!
  market: Market!
  trader: User!
  outcome: String!
  side: String!
  collateralAmount: BigInt!
  shareAmount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type LiquidityEvent @entity(immutable: true) {
  id: Bytes!
  market: Market!
  provider: User!
  action: String!
  collateralAmount: BigInt!
  lpTokenAmount: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type RewardClaim @entity(immutable: true) {
  id: Bytes!
  market: Market!
  user: User!
  payout: BigInt!
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type User @entity(immutable: false) {
  id: Bytes!
  totalTrades: BigInt!
  totalBuyVolume: BigInt!
  totalSellVolume: BigInt!
  totalLiquidityProvided: BigInt!
  totalLiquidityRemoved: BigInt!
  totalRewardsClaimed: BigInt!

  trades: [Trade!]! @derivedFrom(field: "trader")
  liquidityEvents: [LiquidityEvent!]! @derivedFrom(field: "provider")
  claims: [RewardClaim!]! @derivedFrom(field: "user")
}

type ProtocolStats @entity(immutable: false) {
  id: String!
  totalMarkets: BigInt!
  totalTrades: BigInt!
  totalVolume: BigInt!
  totalLiquidityAdded: BigInt!
  totalLiquidityRemoved: BigInt!
  totalRewardsClaimed: BigInt!
}

type GovernanceProposal @entity(immutable: false) {
  id: ID!
  proposalId: BigInt!
  proposer: Bytes!
  description: String!
  voteStart: BigInt!
  voteEnd: BigInt!
  createdAt: BigInt!
  createdAtBlock: BigInt!
  transactionHash: Bytes!
}